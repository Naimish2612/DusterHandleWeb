<div nz-row [nzGutter]="[16, 16]" class="process-page">
  <!-- ================= FILTER MODAL ================= -->
  <nz-modal
    [(nzVisible)]="isFilterVisible"
    nzTitle="Filter Tickets"
    [nzFooter]="filterFooter"
    (nzOnCancel)="closeFilterModal()"
    [nzWidth]="900"
    nzCentered
  >
    <ng-container *nzModalContent>
      <div nz-form [formGroup]="form" nzLayout="vertical">
        <div nz-row [nzGutter]="[16, 16]">
          <!-- Start Date -->
          <div nz-col [nzXs]="24" [nzSm]="12">
            <nz-form-item>
              <nz-form-label>Start Date</nz-form-label>
              <nz-form-control>
                <nz-date-picker
                  style="width: 100%"
                  formControlName="from_date"
                  nzPlaceHolder="Select start date"
                >
                </nz-date-picker>
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- End Date -->
          <div nz-col [nzXs]="24" [nzSm]="12">
            <nz-form-item>
              <nz-form-label>End Date</nz-form-label>
              <nz-form-control>
                <nz-date-picker
                  style="width: 100%"
                  formControlName="to_date"
                  nzPlaceHolder="Select end date"
                >
                </nz-date-picker>
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- Ticket Number -->
          <div nz-col [nzXs]="24" [nzSm]="12">
            <nz-form-item>
              <nz-form-label>Ticket Number</nz-form-label>
              <nz-form-control>
                <input
                  nz-input
                  formControlName="ticket_no"
                  placeholder="Enter Ticket Number"
                />
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- Order Number -->
          <div nz-col [nzXs]="24" [nzSm]="12">
            <nz-form-item>
              <nz-form-label>Order Number</nz-form-label>
              <nz-form-control>
                <input
                  nz-input
                  formControlName="order_no"
                  placeholder="Enter Order Number"
                />
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- Priority -->
          <div nz-col [nzXs]="24" [nzSm]="12">
            <nz-form-item>
              <nz-form-label>Priority</nz-form-label>
              <nz-form-control>
                <nz-select
                  formControlName="priority"
                  nzShowSearch
                  nzAllowClear
                  nzPlaceHolder="Select Priority"
                >
                  <nz-option nzValue="Low" nzLabel="Low"></nz-option>
                  <nz-option nzValue="Medium" nzLabel="Medium"></nz-option>
                  <nz-option nzValue="High" nzLabel="High"></nz-option>
                </nz-select>
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- Status -->
          <div nz-col [nzXs]="24" [nzSm]="12">
            <nz-form-item>
              <nz-form-label>Status</nz-form-label>
              <nz-form-control>
                <nz-select
                  formControlName="status"
                  nzShowSearch
                  nzAllowClear
                  nzPlaceHolder="Select Status"
                >
                  <nz-option nzValue="Open" nzLabel="Open"></nz-option>
                  <nz-option nzValue="In Progress" nzLabel="In Progress"></nz-option>
                  <nz-option nzValue="Resolved" nzLabel="Resolved"></nz-option>
                  <nz-option nzValue="Closed" nzLabel="Closed"></nz-option>
                </nz-select>
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>
      </div>
    </ng-container>

    <!-- Modal Footer -->
    <ng-template #filterFooter>
      <div class="filter-modal-footer">
        <button nz-button nzType="default" (click)="reset()">
          <nz-icon nzType="reload"></nz-icon> Reset
        </button>
        <button nz-button nzType="primary" (click)="submit()">
          <nz-icon nzType="search"></nz-icon> Apply Filter
        </button>
      </div>
    </ng-template>
  </nz-modal>

  <!-- ================= HEADER ================= -->
  <div nz-col nzSpan="24" class="divider-with-action">
    <nz-divider nzOrientation="left" [nzText]="requiredTemplate">
      <ng-template #requiredTemplate>
        <span class="divider-title">Support Tickets</span>
      </ng-template>
    </nz-divider>
    <button
      nz-button
      nzType="default"
      nzShape="circle"
      class="filter-trigger-btn"
      nz-tooltip
      nzTooltipTitle="Filter Tickets"
      (click)="openFilterModal()"
      style="right: 25px"
    >
      <nz-icon nzType="filter" nzTheme="outline"></nz-icon>
    </button>
  </div>
  <div nz-col nzSpan="24">
    <nz-card>
      <div class="table-wrapper">
        <ui-grid
          [title]=""
          ref_name="Support List"
          [autoColumns]="true"
          [dataSource]="gridDataSource"
          [autoLoad]="true"
          [reloadOn]="gridReload$"
          [pageSize]="10"
          [pageSizeOptions]="[10, 20, 50]"
          [serverSide]="false"
          [selectable]="false"
          selectionMode="multiple"
          [actions]="[
            {
              key: 'eye',
              icon: 'message',
              tooltip: 'View/Reply',
              showIf: this.hasViewPermission,
            },
          ]"
          (action)="onAction($event)"
          [hildeColumn]="['ticket_id', 'user_id','product_code', 'upload_attachments']"
        ></ui-grid>
      </div>
    </nz-card>
  </div>
</div>
