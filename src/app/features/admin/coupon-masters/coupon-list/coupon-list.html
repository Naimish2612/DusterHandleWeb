<div nz-row [nzGutter]="[16, 16]" class="process-page">
  <!-- ================= FILTER MODAL ================= -->
  <nz-modal
    [(nzVisible)]="isFilterVisible"
    nzTitle="Filter Coupons"
    [nzFooter]="filterFooter"
    (nzOnCancel)="closeFilterModal()"
    [nzWidth]="900"
    nzCentered
  >
    <ng-container *nzModalContent>
      <div nz-form [formGroup]="form" nzLayout="vertical">
        <div nz-row [nzGutter]="[16, 16]">
          <!-- Start Date -->
          <div nz-col [nzXs]="24" [nzSm]="12">
            <nz-form-item>
              <nz-form-label>Start Date</nz-form-label>
              <nz-form-control>
                <nz-date-picker
                  style="width: 100%"
                  formControlName="start_date"
                  nzPlaceHolder="Select start date"
                >
                </nz-date-picker>
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- End Date -->
          <div nz-col [nzXs]="24" [nzSm]="12">
            <nz-form-item>
              <nz-form-label>End Date</nz-form-label>
              <nz-form-control>
                <nz-date-picker
                  style="width: 100%"
                  formControlName="end_date"
                  nzPlaceHolder="Select end date"
                >
                </nz-date-picker>
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- Coupon Category -->
          <div nz-col [nzXs]="24" [nzSm]="24">
            <nz-form-item>
              <nz-form-label>Coupon Category</nz-form-label>
              <nz-form-control>
                <nz-select
                  formControlName="coupon_category_id"
                  nzShowSearch
                  nzAllowClear
                  nzPlaceHolder="Select Category"
                >
                  @for (c of couponCategoryList; track c.id) {
                    <nz-option [nzValue]="c.id" [nzLabel]="c.value"></nz-option>
                  }
                </nz-select>
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>
      </div>
    </ng-container>

    <!-- Modal Footer -->
    <ng-template #filterFooter>
      <div class="filter-modal-footer">
        <button nz-button nzType="default" (click)="reset()">
          <nz-icon nzType="reload"></nz-icon> Reset
        </button>
        <button nz-button nzType="primary" (click)="submit()">
          <nz-icon nzType="search"></nz-icon> Apply Filter
        </button>
      </div>
    </ng-template>
  </nz-modal>

  <!-- ================= HEADER ================= -->
  <div nz-col nzSpan="24" class="divider-with-action">
    <nz-divider nzOrientation="left" [nzText]="requiredTemplate">
      <ng-template #requiredTemplate>
        <span class="divider-title">Coupon List</span>
      </ng-template>
    </nz-divider>
    <button
      nz-button
      nzType="default"
      nzShape="circle"
      class="filter-trigger-btn"
      nz-tooltip
      nzTooltipTitle="Filter Coupons"
      (click)="openFilterModal()"
      style="right: 25px"
    >
      <nz-icon nzType="filter" nzTheme="outline"></nz-icon>
    </button>
  </div>
  <div nz-col nzSpan="24">
    <nz-card>
      <div class="table-wrapper">
        <ui-grid
          [title]=""
          ref_name="Coupon List"
          [autoColumns]="true"
          [dataSource]="couponGridDataSource"
          [autoLoad]="true"
          [reloadOn]="couponGridReload$"
          [pageSize]="10"
          [pageSizeOptions]="[10, 20, 50]"
          [serverSide]="false"
          [pageSize]="10"
          [selectable]="false"
          selectionMode="multiple"
          [actions]="[
            {
              key: 'edit',
              icon: 'edit',
              tooltip: 'Edit',
              showIf: this.hasEditPermission,
            },
          ]"
          (action)="onAction($event)"
          [hildeColumn]="['coupon_id', 'coupon_category_id']"
        ></ui-grid>
      </div>
    </nz-card>
  </div>
</div>
