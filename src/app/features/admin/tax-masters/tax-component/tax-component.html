<div nz-row [nzGutter]="[16, 16]" class="process-page">
  <!-- ================= FORM CARD ================= -->
  <div nz-col nzSpan="24">
    <nz-card nzTitle="Tax Component Master">
      <form nz-form [formGroup]="form" nzLayout="vertical">
        <div nz-row [nzGutter]="[16, 16]">
          <!-- Component Name -->
          <div nz-col [nzXs]="24" [nzLg]="8">
            <nz-form-item>
              <nz-form-label nzRequired>Component Name</nz-form-label>
              <nz-form-control nzErrorTip="Please enter component name (min 2 characters)">
                <nz-form-control>
                  <input
                    nz-input
                    formControlName="component_name"
                    placeholder="Enter Component Name"
                    type="text"
                  />
                </nz-form-control>
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- Status -->
          <div nz-col [nzXs]="24" [nzLg]="8">
            <nz-form-item>
              <nz-form-label>IsActive</nz-form-label>
              <nz-form-control>
                <nz-switch formControlName="is_active"></nz-switch>
                <span class="switch-label">
                  {{ form.get('is_active')?.value ? 'Active' : 'Inactive' }}
                </span>
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- ACTIONS -->
          <div nz-col nzSpan="24" class="form-actions">
            <button
              nz-button
              nzType="primary"
              htmlType="submit"
              (click)="submit()"
              *ngIf="showAddButton && hasAddPermission"
            >
              <nz-icon nzType="save"></nz-icon> Save
            </button>
            <button
              nz-button
              nzType="primary"
              (click)="taxComponentUpdate()"
              *ngIf="showUpdateButton && hasAddPermission"
            >
              <nz-icon nzType="edit"></nz-icon> Update
            </button>
            <button nz-button nzType="default" type="button" (click)="reset()">
              <nz-icon nzType="reload"></nz-icon> Reset
            </button>
          </div>
        </div>
      </form>
    </nz-card>
  </div>

  <!-- ================= GRID PLACEHOLDER ================= -->
  <nz-divider nzOrientation="left" nzText="Tax Component List"></nz-divider>
  <div nz-col nzSpan="24">
    <nz-card>
      <div class="table-wrapper">
        <ui-grid
          [title]=""
          ref_name="Tax Component List"
          [autoColumns]="true"
          [dataSource]="taxComponentGridDataSource"
          [autoLoad]="true"
          [reloadOn]="taxComponentGridReload$"
          [pageSize]="10"
          [pageSizeOptions]="[10, 20, 50]"
          [serverSide]="false"
          [selectable]="false"
          selectionMode="multiple"
          [actions]="[
            {
              key: 'edit',
              icon: 'edit',
              tooltip: 'Edit',
              showIf: this.hasEditPermission,
            },
            {
              key: 'delete',
              icon: 'delete',
              tooltip: 'Delete',
              danger: true,
              showIf: this.hasDeletePermission,
            },
          ]"
          (selectionChange)="selectionChanged($event)"
          (action)="onAction($event)"
          [hildeColumn]="[]"
        ></ui-grid>
      </div>
    </nz-card>
  </div>
</div>
