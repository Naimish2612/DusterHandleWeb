<div nz-row [nzGutter]="[16, 16]" class="process-page">
  <!-- ================= FORM CARD ================= -->
  <div nz-col nzSpan="24">
    <nz-card nzTitle="Role Master">
      <form nz-form [formGroup]="form" nzLayout="vertical">
        <div nz-row [nzGutter]="[16, 16]">
          <!-- Role Name -->
          <div nz-col [nzXs]="24" [nzLg]="6">
            <nz-form-item>
              <nz-form-label nzRequired>Role Name</nz-form-label>
              <nz-form-control nzErrorTip="Please enter role name (min 3 characters)">
                <nz-form-control>
                  <input
                    nz-input
                    formControlName="role_name"
                    placeholder="Enter Role Name"
                    type="text"
                  />
                </nz-form-control>
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- Status -->
          <div nz-col [nzXs]="24" [nzLg]="6">
            <nz-form-item>
              <nz-form-label>IsActive</nz-form-label>
              <nz-form-control>
                <nz-switch formControlName="is_active"></nz-switch>
                <span class="switch-label">
                  {{ form.get('is_active')?.value ? 'Active' : 'Inactive' }}
                </span>
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- Status -->
          <div nz-col [nzXs]="24" [nzLg]="6">
            <nz-form-item>
              <nz-form-label>IsBlock</nz-form-label>
              <nz-form-control>
                <nz-switch formControlName="is_block"></nz-switch>
                <span class="switch-label">
                  {{ form.get('is_block')?.value ? 'Blocked' : 'Not Blocked' }}
                </span>
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- Description (FULL WIDTH) -->
          <div nz-col nzSpan="24">
            <nz-form-item>
              <nz-form-label nzTooltipTitle="What do you want other to call you"
                >Description</nz-form-label
              >
              <nz-form-control>
                <textarea nz-input rows="2" formControlName="role_description"></textarea>
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- ACTIONS -->
          <div nz-col nzSpan="24" class="form-actions">
            <button
              nz-button
              nzType="primary"
              htmlType="submit"
              (click)="submit()"
              *ngIf="showAddButton && hasAddPermission"
            >
              <nz-icon nzType="save"></nz-icon> Save
            </button>
            <button
              nz-button
              nzType="primary"
              (click)="roleUpdate()"
              *ngIf="showUpdateButton && hasAddPermission"
            >
              <nz-icon nzType="edit"></nz-icon> Update
            </button>
            <button nz-button nzType="default" type="button" (click)="reset()">
              <nz-icon nzType="reload"></nz-icon> Reset
            </button>
          </div>
        </div>
      </form>
    </nz-card>
  </div>

  <!-- ================= GRID PLACEHOLDER ================= -->
  <nz-divider nzOrientation="left" nzText="Role List"></nz-divider>
  <div nz-col nzSpan="24">
    <nz-card>
      <div class="table-wrapper">
        <ui-grid
          [title]=""
          ref_name="Role Master List"
          [autoColumns]="true"
          [dataSource]="roleGridDataSource"
          [autoLoad]="true"
          [reloadOn]="roleGridReload$"
          [pageSize]="10"
          [pageSizeOptions]="[10, 20, 50]"
          [serverSide]="false"
          [selectable]="false"
          selectionMode="multiple"
          [actions]="[
            {
              key: 'edit',
              icon: 'edit',
              tooltip: 'Edit',
              showIf: this.hasEditPermission,
            },
            {
              key: 'role_permission',
              icon: 'api',
              tooltip: 'Role To Permission Mapping',
              showIf: this.hasRoleToPermissionMap,
            },
            {
              key: 'delete',
              icon: 'delete',
              tooltip: 'Delete',
              danger: true,
              showIf: this.hasDeletePermission,
            },
          ]"
          (selectionChange)="selectionChanged($event)"
          (action)="onAction($event)"
          [hildeColumn]="['role_code']"
        ></ui-grid>
      </div>
    </nz-card>
  </div>
</div>
