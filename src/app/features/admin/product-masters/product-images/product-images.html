<div nz-row [nzGutter]="[16, 16]" class="process-page">
  <!-- ================= FORM CARD ================= -->
  <div>
    <button nz-button nzType="link" (click)="goBack()">
      <nz-icon nzType="arrow-left"></nz-icon> Back to List
    </button>
  </div>

  <div nz-col [nzXs]="24" [nzLg]="24" class="image-upload-section">
    <nz-divider nzOrientation="left" [nzText]="requiredTemplate1">
      <ng-template #requiredTemplate1>
        <!-- <span nz-typography nzType="danger">*</span> -->
        <span>Product Images</span>
      </ng-template>
    </nz-divider>
    <div nz-col [nzXs]="24" [nzLg]="24">
      <nz-descriptions>
        <nz-descriptions-item nzTitle="Product Name">{{ _name }}</nz-descriptions-item>
        <nz-descriptions-item nzTitle="Product SKU">{{ _sku }}</nz-descriptions-item>
      </nz-descriptions>
    </div>

    <div class="image-upload-form">
      <div class="upload-controls">
        <nz-form-item>
          <nz-form-control>
            <input
              type="file"
              accept="image/png, image/jpeg, image/webp"
              multiple
              #fileInput
              (change)="onFilesSelected($event)"
              style="display: none"
            />
            <button
              nz-button
              nzType="dashed"
              type="button"
              (click)="fileInput.click()"
              [disabled]="(existingImagesCount + imageListUpload.length) >= 10"
            >
              <nz-icon nzType="upload"></nz-icon>
              Select Image
            </button>
          </nz-form-control>
        </nz-form-item>

        <span class="image-count-badge">
          @if (imageListUpload.length < 1) {
            <nz-tag nzColor="orange">Minimum 1 required</nz-tag>
          }
        </span>
      </div>
    </div>

    <div
      class="image-table-wrapper"
      [hidden]="imageListUpload.length === 0"
      style="margin-top: 10px"
    >
      <ui-grid
        [title]="''"
        [autoColumns]="true"
        [dataSource]="imageUploadGridDataSource"
        [reloadOn]="imageUploadReload$"
        [actions]="[
          { key: 'view', icon: 'eye', tooltip: 'View' },
          {
            key: 'delete',
            icon: 'delete',
            tooltip: 'Delete',
            danger: true,
            showIf: this.hasDeletePermission,
          },
        ]"
        (action)="onImageAction($event)"
        [hildeColumn]="['file', 'preview', 'uid']"
      >
        <ng-template #columnTemplate let-data let-column="column">
          <!-- Handle the Sequence Number -->
          @if (column === 'id') {
            <span style="font-weight: bold">{{ data.id }}</span>
          }

          <!-- Handle the Name + Preview -->
          @if (column === 'name') {
            <div style="display: flex; align-items: center">
              <img
                [src]="data.preview"
                style="
                  width: 30px;
                  height: 30px;
                  object-fit: cover;
                  margin-right: 8px;
                  border-radius: 4px;
                "
              />
              <span>{{ data.name }}</span>
            </div>
          }
        </ng-template>
      </ui-grid>
    </div>
    @if (hasAddPermission) {
      <div style="margin-top: 1rem">
        <button
          nz-button
          nzType="primary"
          htmlType="submit"
          [disabled]="imageListUpload.length < 1"
          (click)="submit()"
        >
          Upload Image(s)
        </button>
      </div>
    }
  </div>

  <div nz-col [nzXs]="24" [nzLg]="24" class="image-upload-section">
    <div class="image-table-wrapper" style="margin-top: 10px">
      <ui-grid
        [title]="''"
        [autoColumns]="true"
        [dataSource]="imageGridDataSource"
        [reloadOn]="imageReload$"
        [actions]="[
          { key: 'view', icon: 'eye', tooltip: 'View' },
          {
            key: 'delete',
            icon: 'delete',
            tooltip: 'Delete',
            danger: true,
            showIf: this.hasDeletePermission,
          },
        ]"
        (action)="onImageAction($event)"
        [hildeColumn]="[
          'image_url',
          'file',
          'preview',
          'uid',
          'product_id',
          'product_image_id',
          'alt_text',
          'created_at',
          'updated_at',
          'created_by',
          'updated_by',
          'product_code',
          'display_order',
          'is_primary',
        ]"
      >
      </ui-grid>
    </div>
  </div>
</div>
<nz-modal
  [(nzVisible)]="isImagePreviewVisible"
  [nzTitle]="'Preview Image'"
  [nzFooter]="null"
  (nzOnCancel)="closeImagePreview()"
  [nzWidth]="720"
  nzCentered
>
  <ng-container *nzModalContent>
    <div class="image-preview-container" style="position: relative; min-height: 200px">
      @if (isImageLoading) {
        <div class="skeleton-wrapper">
          <nz-skeleton-element nzType="image" [nzActive]="true" style="width: 100%; height: 400px">
          </nz-skeleton-element>
        </div>
      }
      <img
        [src]="previewImageUrl"
        [alt]="previewImageName"
        [style.display]="isImageLoading ? 'none' : 'inline-block'"
        (load)="onImageLoaded()"
      />
    </div>
  </ng-container>
</nz-modal>
