<div nz-row [nzGutter]="[16, 16]" class="process-page">
  <!-- ================= FILTER MODAL ================= -->
  <nz-modal
    [(nzVisible)]="isFilterVisible"
    nzTitle="Filter Banners"
    [nzFooter]="filterFooter"
    (nzOnCancel)="closeFilterModal()"
    [nzWidth]="900"
    nzCentered
  >
    <ng-container *nzModalContent>
      <div nz-form [formGroup]="form" nzLayout="vertical">
        <div nz-row [nzGutter]="[16, 16]">
          <div nz-col [nzXs]="24" [nzSm]="12">
            <nz-form-item>
              <nz-form-label>Start Date</nz-form-label>
              <nz-form-control>
                <nz-date-picker
                  style="width: 100%"
                  formControlName="start_date"
                  nzPlaceHolder="Select start date"
                >
                </nz-date-picker>
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- End Date -->
          <div nz-col [nzXs]="24" [nzSm]="12">
            <nz-form-item>
              <nz-form-label>End Date</nz-form-label>
              <nz-form-control>
                <nz-date-picker
                  style="width: 100%"
                  formControlName="end_date"
                  nzPlaceHolder="Select end date"
                >
                </nz-date-picker>
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- State -->
          <div nz-col [nzXs]="24" [nzSm]="6">
            <nz-form-item>
              <nz-form-label>State</nz-form-label>
              <nz-form-control>
                <nz-select
                  formControlName="state_id"
                  nzShowSearch
                  nzAllowClear
                  nzPlaceHolder="Select State"
                >
                  <nz-option [nzValue]="0" nzLabel="All States"></nz-option>
                  @for (s of stateList; track s) {
                    <nz-option [nzValue]="s" [nzLabel]="s"></nz-option>
                  }
                </nz-select>
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- Platform -->
          <div nz-col [nzXs]="24" [nzSm]="6">
            <nz-form-item>
              <nz-form-label>Platform</nz-form-label>
              <nz-form-control>
                <nz-select formControlName="platform" nzPlaceHolder="Select Platform">
                  @for (platform of platformOptions; track platform) {
                    <nz-option [nzValue]="platform" [nzLabel]="platform"></nz-option>
                  }
                </nz-select>
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- Is Active -->
          <div nz-col [nzXs]="24" [nzSm]="3">
            <nz-form-item>
              <nz-form-label>Is Active</nz-form-label>
              <nz-form-control>
                <nz-switch formControlName="is_active"></nz-switch>
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>
      </div>
    </ng-container>

    <!-- Modal Footer -->
    <ng-template #filterFooter>
      <div class="filter-modal-footer">
        <button nz-button nzType="default" (click)="reset()">
          <nz-icon nzType="reload"></nz-icon> Reset
        </button>
        <button nz-button nzType="primary" (click)="submit()">
          <nz-icon nzType="search"></nz-icon> Apply Filter
        </button>
      </div>
    </ng-template>
  </nz-modal>

  <!-- ================= HEADER ================= -->
  <div nz-col nzSpan="24" class="divider-with-action">
    <nz-divider nzOrientation="left" [nzText]="requiredTemplate">
      <ng-template #requiredTemplate>
        <span class="divider-title">Banner List</span>
      </ng-template>
    </nz-divider>
    <button
      nz-button
      nzType="default"
      nzShape="circle"
      class="filter-trigger-btn"
      nz-tooltip
      nzTooltipTitle="Filter Banners"
      (click)="openFilterModal()"
    >
      <nz-icon nzType="filter" nzTheme="outline"></nz-icon>
    </button>
  </div>

  <!-- ================= GRID ================= -->
  <div nz-col nzSpan="24">
    <nz-card>
      <div class="table-wrapper">
        <ui-grid
          [title]=""
          ref_name="Banner List"
          [autoColumns]="true"
          [dataSource]="bannerGridDataSource"
          [autoLoad]="true"
          [reloadOn]="bannerGridReload$"
          [pageSize]="10"
          [pageSizeOptions]="[10, 20, 50]"
          [serverSide]="false"
          [selectable]="false"
          selectionMode="multiple"
          [actions]="[
            {
              key: 'edit',
              icon: 'edit',
              tooltip: 'Edit',
              showIf: this.hasEditPermission,
            },
            {
              key: 'toggleActive',
              icon: 'swap',
              tooltip: 'Toggle Active Status',
              showIf: this.hasEditPermission,
            },
            {
              key: 'view',
              icon: 'eye',
              tooltip: 'View',
            },
          ]"
          (action)="onAction($event)"
          [hildeColumn]="['banner_id', 'image_url', 'image_public_id']"
        ></ui-grid>
      </div>
    </nz-card>
  </div>
</div>

<!-- ================= VIEW MODAL ================= -->
<nz-modal
  [(nzVisible)]="isImagePreviewVisible"
  [nzTitle]="previewImageName"
  [nzFooter]="null"
  (nzOnCancel)="closeImagePreview()"
  [nzWidth]="720"
  nzCentered
>
  <ng-container *nzModalContent>
    <div class="image-preview-container" style="position: relative; min-height: 200px">
      @if (isImageLoading) {
        <div class="skeleton-wrapper">
          <nz-skeleton-element nzType="image" [nzActive]="true" style="width: 100%; height: 400px">
          </nz-skeleton-element>
        </div>
      }
      <img
        [src]="previewImageUrl"
        [alt]="previewImageName"
        [style.display]="isImageLoading ? 'none' : 'inline-block'"
        (load)="onImageLoaded()"
      />
    </div>
  </ng-container>
</nz-modal>
