<div nz-row [nzGutter]="[16, 16]" class="process-page">
  <!-- ================= FORM CARD ================= -->
  <div nz-col nzSpan="24">
    <nz-card nzTitle="Manufacturer">
      <form nz-form [formGroup]="form" nzLayout="vertical">
        <div nz-row [nzGutter]="[16, 16]">
          <!-- Manufacturer Name -->
          <div nz-col [nzXs]="24" [nzLg]="6">
            <nz-form-item>
              <nz-form-label nzRequired>Manufacturer Name</nz-form-label>
              <nz-form-control
                nzErrorTip="Please enter manufacturer name (min 3 characters)"
              >
                <input
                  nz-input
                  formControlName="name"
                  placeholder="Enter Manufacturer Name"
                  type="text"
                />
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- Website -->
          <div nz-col [nzXs]="24" [nzLg]="6">
            <nz-form-item>
              <nz-form-label >Website</nz-form-label>
              <nz-form-control [nzErrorTip]="keyError">
                <input
                  nz-input
                  formControlName="website"
                  placeholder="Enter Website URL"
                  type="website"
                />
                <ng-template #keyError let-control>
                 @if (control.hasError('pattern')) {
                    Please enter a valid website
                  }
                </ng-template>
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- Support Email -->
          <div nz-col [nzXs]="24" [nzLg]="6">
            <nz-form-item>
              <nz-form-label>Support Email</nz-form-label>
              <nz-form-control nzErrorTip="Please enter a valid email address">
                <input
                  nz-input
                  formControlName="support_email"
                  placeholder="Enter Support Email"
                  type="email"
                />
              </nz-form-control>
            </nz-form-item>
          </div>
         

          <!-- ACTIONS -->
          <div nz-col nzSpan="24" class="form-actions">
            @if(showAddButton && hasAddPermission){
              <button
                nz-button
                nzType="primary"
                htmlType="submit"
                [disabled]="!form.valid"
                (click)="submit()"
              >
                <nz-icon nzType="save"></nz-icon> Save
              </button>
            }
            @if(showUpdateButton && hasEditPermission){
              <button
                nz-button
                nzType="primary"
                 [disabled]="!form.valid"
                (click)="manufacturerUpdate()"
              >
                <nz-icon nzType="edit"></nz-icon> Update
              </button>
            }
            <button nz-button nzType="default" type="button" (click)="reset()">
              <nz-icon nzType="reload"></nz-icon> Reset
            </button>
          </div>
        </div>
      </form>
    </nz-card>
  </div>

  <!-- ================= GRID ================= -->
  <nz-divider nzOrientation="left" nzText="Manufacturer List"></nz-divider>
  <div nz-col nzSpan="24">
    <nz-card>
      <div class="table-wrapper">
        <ui-grid
          [title]=""
          ref_name="Manufacture List"
          [autoColumns]="true"
          [dataSource]="manufacturerGridDataSource"
          [autoLoad]="true"
          [reloadOn]="manufacturerGridReload$"
          [pageSize]="10"
          [pageSizeOptions]="[10, 20, 50]"
          [serverSide]="false"
          [selectable]="false"
          selectionMode="multiple"
          [actions]="[
            {
              key: 'edit',
              icon: 'edit',
              tooltip: 'Edit',
              showIf: this.hasEditPermission
            },
          ]"
          (selectionChange)="selectionChanged($event)"
          (action)="onAction($event)"
          [hildeColumn]="['manufacturer_id']"
        ></ui-grid>
      </div>
    </nz-card>
</div>
