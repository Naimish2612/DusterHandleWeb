<div nz-row [nzGutter]="[16, 16]" class="process-page">
  <!-- ================= FORM CARD ================= -->
  <div nz-col nzSpan="24">
    <nz-card nzTitle="Product Sub Category" [nzExtra]="extraTemplate">
      <ng-template #extraTemplate>
        <button
          nz-button
          nzType="default"
          (click)="goToImport()"
          type="button"
          style="display: flex; align-items: center; gap: 4px"
        >
          <nz-icon nzType="import"></nz-icon> Import
        </button>
      </ng-template>
      <form nz-form [formGroup]="form" nzLayout="vertical">
        <div nz-row [nzGutter]="[16, 16]">
          <!-- Product Category (Dropdown) -->
          <div nz-col [nzXs]="24" [nzLg]="6">
            <nz-form-item>
              <nz-form-label
                nzTooltipTitle="Select the product category associated with this sub category"
                nzRequired
                >Product Category</nz-form-label
              >
              <nz-form-control nzErrorTip="Please select a product category">
                <nz-select
                  formControlName="category_id"
                  nzShowSearch
                  nzAllowClear
                  nzPlaceHolder="Select Product Category"
                  (ngModelChange)="onCategoryChange($event)"
                >
                  @for (category of categoryList; track category.id) {
                    <nz-option [nzValue]="category.id" [nzLabel]="category.value"></nz-option>
                  }
                </nz-select>
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- Sub Category Name -->
          <div nz-col [nzXs]="24" [nzLg]="6">
            <nz-form-item>
              <nz-form-label nzRequired>Sub Category Name</nz-form-label>
              <nz-form-control nzErrorTip="Please enter sub category name (min 3 characters)">
                <input
                  nz-input
                  formControlName="name"
                  placeholder="Enter Sub Category Name"
                  type="text"
                />
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- Slug -->
          <div nz-col [nzXs]="24" [nzLg]="6">
            <nz-form-item>
              <nz-form-label>Slug</nz-form-label>
              <nz-form-control nzErrorTip="Please enter a valid slug">
                <input nz-input formControlName="slug" placeholder="Enter Slug" type="text" />
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- ACTIONS -->

          <div nz-col nzSpan="24" class="form-actions">
            @if (showAddButton && hasAddPermission) {
              <button nz-button nzType="primary" htmlType="submit" (click)="submit()">
                <nz-icon nzType="save"></nz-icon> Save
              </button>
            }
            @if (showUpdateButton && hasEditPermission) {
              <button nz-button nzType="primary" (click)="productSubCategoryUpdate()">
                <nz-icon nzType="edit"></nz-icon> Update
              </button>
            }
            <button nz-button nzType="default" type="button" (click)="reset()">
              <nz-icon nzType="reload"></nz-icon> Reset
            </button>
          </div>
        </div>
      </form>
    </nz-card>
  </div>

  <!-- ================= GRID ================= -->
  <nz-divider nzOrientation="left" nzText="Product Sub Category List"></nz-divider>
  <div nz-col nzSpan="24">
    <nz-card>
      <div class="table-wrapper">
        <ui-grid
          [title]=""
          ref_name="Product Subcategory List"
          [autoColumns]="true"
          [dataSource]="subCategoryGridDataSource"
          [autoLoad]="true"
          [reloadOn]="subCategoryGridReload$"
          [pageSize]="10"
          [pageSizeOptions]="[10, 20, 50]"
          [serverSide]="false"
          [selectable]="false"
          selectionMode="multiple"
          [actions]="[
            {
              key: 'edit',
              icon: 'edit',
              tooltip: 'Edit',
              showIf: this.hasEditPermission,
            },
          ]"
          (selectionChange)="selectionChanged($event)"
          (action)="onAction($event)"
          [hildeColumn]="['category_id', 'sub_category_id']"
        ></ui-grid>
      </div>
    </nz-card>
  </div>
</div>
