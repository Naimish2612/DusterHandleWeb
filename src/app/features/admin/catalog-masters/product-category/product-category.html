<div nz-row [nzGutter]="[16, 16]" class="process-page">
  <!-- ================= FORM CARD ================= -->
  <div nz-col nzSpan="24">
    <nz-card nzTitle="Product Category" [nzExtra]="extraTemplate">
      <ng-template #extraTemplate>
        <button nz-button nzType="default" (click)="goToImport()" type="button" style="display: flex; align-items: center; gap: 4px;">
          <nz-icon nzType="import"></nz-icon> Import
        </button>
      </ng-template>
      <form nz-form [formGroup]="form" nzLayout="vertical">
        <div nz-row [nzGutter]="[16, 16]">
          <!-- Product Category Name -->
          <div nz-col [nzXs]="24" [nzLg]="6">
            <nz-form-item>
              <nz-form-label nzRequired>Product Category Name</nz-form-label>
              <nz-form-control
                nzErrorTip="Please enter product category name (min 3 characters)"
              >
                <nz-form-control>
                  <input
                    nz-input
                    formControlName="product_category_name"
                    placeholder="Enter Product Category Name"
                    type="text"
                  />
                </nz-form-control>
              </nz-form-control>
            </nz-form-item>
          </div>
          <!-- Slug -->
          <div nz-col [nzXs]="24" [nzLg]="6">
            <nz-form-item>
              <nz-form-label>Slug</nz-form-label>
              <nz-form-control nzErrorTip="Please enter a valid slug">
                <input
                  nz-input
                  formControlName="slug"
                  placeholder="Enter Slug"
                  type="text"
                />
              </nz-form-control>
            </nz-form-item>
          </div>


          <!-- Status -->
          <div nz-col [nzXs]="24" [nzLg]="6">
            <nz-form-item>
              <nz-form-label>IsActive</nz-form-label>
              <nz-form-control>
                <nz-switch formControlName="is_active"></nz-switch>
                <span class="switch-label">
                  {{ form.get("is_active")?.value ? "Active" : "Inactive" }}
                </span>
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- Description (FULL WIDTH) -->
          <div nz-col nzSpan="24">
            <nz-form-item>
              <nz-form-label nzTooltipTitle="Briefly explain what this product category includes."
                >Description</nz-form-label
              >
              <nz-form-control>
                <textarea
                  nz-input
                  rows="2"
                  formControlName="product_category_description"
                ></textarea>
              </nz-form-control>
            </nz-form-item>
          </div>
          

          <!-- ACTIONS -->
          <div nz-col nzSpan="24" class="form-actions">
            @if(showAddButton && hasAddPermission){
              <button
                nz-button
                nzType="primary"
                htmlType="submit"
                (click)="submit()"
              >
                <nz-icon nzType="save"></nz-icon> Save
              </button>
            }
            <!-- *ngIf="showAddButton && hasAddPermission" -->
            @if(showUpdateButton && hasEditPermission){
              <button
                nz-button
                nzType="primary"
                (click)="productCategoryUpdate()"
              >
                <nz-icon nzType="edit"></nz-icon> Update
              </button>
            }
            <button nz-button nzType="default" type="button" (click)="reset()">
              <nz-icon nzType="reload"></nz-icon> Reset
            </button>
          </div>
        </div>
      </form>
    </nz-card>
  </div>

  <!-- ================= GRID PLACEHOLDER ================= -->
  <nz-divider nzOrientation="left" nzText="Product Category List"></nz-divider>
  <div nz-col nzSpan="24">
    <nz-card>
      <div class="table-wrapper">
        <ui-grid
          [title]=""
          ref_name="Product Category List"
          [autoColumns]="true"
          [dataSource]="productCategoryGridDataSource"
          [autoLoad]="true"
          [reloadOn]="productCategoryGridReload$"
          [pageSize]="10"
          [pageSizeOptions]="[10, 20, 50]"
          [serverSide]="false"
          [selectable]="false"
          selectionMode="multiple"
          [actions]="[
            {
              key: 'edit',
              icon: 'edit',
              tooltip: 'Edit',
              showIf: this.hasEditPermission,
            },
          ]"
          (selectionChange)="selectionChanged($event)"
          (action)="onAction($event)"
          [hildeColumn]="['category_id']"
        ></ui-grid>
      </div>
    </nz-card>
  </div>
</div>
