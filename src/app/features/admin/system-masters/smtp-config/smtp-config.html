<div nz-row [nzGutter]="[16, 16]" class="process-page">
  <!-- ================= FORM CARD ================= -->
  <div nz-col nzSpan="24">
    <nz-card nzTitle="SMTP Configuration">
      <form nz-form [formGroup]="form" nzLayout="vertical">
        <div nz-row [nzGutter]="[16, 16]">
          <!-- Configuration Name -->
          <div nz-col [nzXs]="24" [nzLg]="6">
            <nz-form-item>
              <nz-form-label nzRequired>Configuration Name</nz-form-label>
              <nz-form-control nzErrorTip="Please enter configuration name (min 3 characters)">
                <input
                  nz-input
                  formControlName="config_name"
                  placeholder="Enter Configuration Name"
                  type="text"
                />
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- SMTP Host -->
          <div nz-col [nzXs]="24" [nzLg]="6">
            <nz-form-item>
              <nz-form-label nzRequired>SMTP Host</nz-form-label>
              <nz-form-control nzErrorTip="Please enter SMTP host (min 3 characters)">
                <input nz-input formControlName="host" placeholder="Enter SMTP Host" type="text" />
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- SMTP Port -->
          <div nz-col [nzXs]="24" [nzLg]="6">
            <nz-form-item>
              <nz-form-label nzRequired>SMTP Port</nz-form-label>
              <nz-form-control nzErrorTip="Please enter a valid port number">
                <input nz-input formControlName="port" placeholder="Enter Port" type="number" />
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- SMTP Username -->
          <div nz-col [nzXs]="24" [nzLg]="6">
            <nz-form-item>
              <nz-form-label nzRequired>SMTP Username</nz-form-label>
              <nz-form-control nzErrorTip="Please enter a SMTP username">
                <input
                  nz-input
                  formControlName="username"
                  placeholder="Enter SMTP Username"
                  type="text"
                />
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- SMTP Password -->
          <div nz-col [nzXs]="24" [nzLg]="6">
            <nz-form-item>
              <nz-form-label nzRequired>SMTP Password</nz-form-label>
              <nz-form-control nzErrorTip="Please enter a SMTP password">
                <input
                  nz-input
                  formControlName="password_encrypted"
                  placeholder="Enter SMTP Password"
                  type="password"
                />
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- From Email -->
          <div nz-col [nzXs]="24" [nzLg]="6">
            <nz-form-item>
              <nz-form-label nzRequired>From Email</nz-form-label>
              <nz-form-control nzErrorTip="Please enter a valid email address">
                <input
                  nz-input
                  formControlName="from_email"
                  placeholder="Enter From Email"
                  type="email"
                />
              </nz-form-control>
            </nz-form-item>
          </div>

          <div nz-col [nzXs]="24" [nzLg]="6">
            <nz-form-item>
              <nz-form-label nzRequired>SMTP Category</nz-form-label>
              <nz-form-control>
                <nz-select
                  formControlName="smtp_category"
                  nzPlaceHolder="Select Category"
                  [nzDropdownRender]="renderTemplate"
                >
                  @for (g of stmpCategory; track g.value) {
                    <nz-option [nzValue]="g.value" [nzLabel]="g.label"></nz-option>
                  }
                </nz-select>

                <!-- Custom Dropdown Extension -->
                <ng-template #renderTemplate>
                  <nz-divider style="margin: 4px 0"></nz-divider>
                  <div class="container">
                    <input
                      type="text"
                      nz-input
                      #inputElement
                      (input)="inputElement.value = inputElement.value.toUpperCase()"
                      placeholder="Add new category..."
                    />
                    <a class="add-item" (click)="addItem(inputElement)">
                      <span nz-icon nzType="plus"></span> Add
                    </a>
                  </div>
                </ng-template>
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- From Name -->
          <div nz-col [nzXs]="24" [nzLg]="6">
            <nz-form-item>
              <nz-form-label nzRequired>From Name</nz-form-label>
              <nz-form-control nzErrorTip="Please enter a From Name">
                <input
                  nz-input
                  formControlName="from_name"
                  placeholder="Enter From Name"
                  type="text"
                />
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- Is Active Switch -->
          <div nz-col [nzXs]="12" [nzLg]="3">
            <nz-form-item>
              <nz-form-label nzRequired>Is Active</nz-form-label>
              <nz-form-control>
                <nz-switch formControlName="is_active"></nz-switch>
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- Is Default Switch -->
          <div nz-col [nzXs]="12" [nzLg]="3">
            <nz-form-item>
              <nz-form-label nzRequired>Is Default</nz-form-label>
              <nz-form-control>
                <nz-switch formControlName="is_default"></nz-switch>
              </nz-form-control>
            </nz-form-item>
          </div>

          <!-- ACTIONS -->
          <div nz-col nzSpan="24" class="form-actions">
            @if (showAddButton && hasAddPermission) {
              <button nz-button nzType="primary" htmlType="submit" [disabled]="!form.valid" (click)="submit()">
                <nz-icon nzType="save"></nz-icon> Save
              </button>
            }
            @if (showUpdateButton && hasEditPermission) {
              <button nz-button nzType="primary" (click)="smtpConfigUpdate()">
                <nz-icon nzType="edit"></nz-icon> Update
              </button>
            }
            <button nz-button nzType="default" type="button" (click)="reset()">
              <nz-icon nzType="reload"></nz-icon> Reset
            </button>
          </div>
        </div>
      </form>
    </nz-card>
  </div>

  <!-- ================= GRID ================= -->
  @if (hasViewPermission) {
    <nz-divider nzOrientation="left" nzText="SMTP Configuration List"></nz-divider>
    <div nz-col nzSpan="24">
      <nz-card>
        <div class="table-wrapper">
          <ui-grid
            [title]=""
            ref_name="SMTP Configuration List"
            [autoColumns]="true"
            [dataSource]="smtpConfigGridDataSource"
            [autoLoad]="true"
            [reloadOn]="smtpConfigGridReload$"
            [pageSize]="10"
            [pageSizeOptions]="[10, 20, 50]"
            [serverSide]="false"
            [selectable]="false"
            selectionMode="multiple"
            [actions]="[
              {
                key: 'edit',
                icon: 'edit',
                tooltip: 'Edit',
                showIf: this.hasEditPermission,
              },
            ]"
            (selectionChange)="selectionChanged($event)"
            (action)="onAction($event)"
            [hildeColumn]="['smtp_config_id', 'password_encrypted']"
          ></ui-grid>
        </div>
      </nz-card>
    </div>
  }
</div>
