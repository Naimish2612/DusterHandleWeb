<!-- =====================================================================
     AUTH LAYOUT
     Split-screen: decorative left panel + form right panel
     ===================================================================== -->
<div class="auth-layout">

  <!-- ── RIGHT PANEL ── form area ──────────────────────────────────── -->
  <main class="auth-layout__form-area">
    <!-- Top bar -->
    <header class="auth-layout__topbar">
      <a routerLink="/home" class="auth-layout__back-link">
        <span nz-icon nzType="arrow-left"></span>
        <span>Back to store</span>
      </a>
    </header>

    <!-- Form slot -->
    <div class="auth-layout__form-wrapper">
      <router-outlet />
    </div>

    <!-- Footer -->
    <footer class="auth-layout__footer">
      <p>© {{ currentYear }} DUSTER. All rights reserved.</p>
      <div class="auth-layout__footer-links">

        <a class="footer-policy-btn" (click)="openPolicy('cookie_policy')"> Cookie Policy </a>
        <a class="footer-policy-btn" (click)="openPolicy('privacy_policy')"> Privacy Policy </a>
        <a class="footer-policy-btn" (click)="openPolicy('terms_of_service')"> Terms of Service </a>
        <!-- <a class="footer-policy-btn" (click)="openPolicy('help_center')"> Help Center </a> -->
      </div>
    </footer>
  </main>

</div>

<!-- ─── POLICY MODAL ✅ added at bottom, outside layout div ─── -->
<app-policy-modal [policyKey]="activePolicyKey" [isVisible]="isPolicyModalOpen"
  (closeModal)="closePolicy()"></app-policy-modal>
